services:
  postgres:
    image: postgres:16
    container_name: secondgo-db
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secondgo
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
